# Memoria de Gradle ajustada a un equipo de ~8 GB de RAM. La plantilla de
# Flutter reserva 8 GB solo para Gradle, que junto con el proceso de Kotlin
# agota la memoria de un portatil comun y hace fallar la compilacion.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m

# La compilacion incremental de Kotlin falla en Windows cuando la cache de
# paquetes de Flutter (C:) y el proyecto (otra unidad, p. ej. E:) estan en
# unidades distintas: "this and base files have different roots". Desactivarla
# solo alarga un poco las recompilaciones.
kotlin.incremental=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
