# Servidor del panel administrativo.
#
# Hace dos cosas: servir los archivos estaticos del panel y reenviar /api al
# backend. Asi el navegador ve un unico origen y no hace falta configurar CORS
# ni exponer el puerto del backend.

upstream api_backend {
    server api:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Seguridad de cabeceras ---------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # No se cachea el HTML: asi un despliegue nuevo llega de inmediato.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Subida de fotografias.
        client_max_body_size 12m;

        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --- Canal en tiempo real (SSE) ------------------------------------------
    # Necesita buffering desactivado y un tiempo de lectura largo, o el proxy
    # cortaria la conexion y el panel dejaria de recibir novedades.
    location /api/v1/notificaciones/stream {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # --- Enrutado de la aplicacion de pagina unica ---------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
